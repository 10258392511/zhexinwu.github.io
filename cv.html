<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Zhexin Wu's Homepage</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://ethz.ch/etc/designs/ethz/img/icons/ETH-APP-Icons-Theme-white/58-Settings.png">
    <link rel="stylesheet" href="css/cv_style.css">
</head>

<body>
    <div class="pdf-app">
        <header class="pdf-toolbar">
            <span class="pdf-toolbar__title">CV, Zhexin Wu.pdf</span>
            <div class="pdf-toolbar__controls">
                <button type="button" id="zoom-out" class="pdf-toolbar__btn" aria-label="Zoom out" title="Zoom out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
                <span id="zoom-level" class="pdf-toolbar__zoom">100%</span>
                <button type="button" id="zoom-in" class="pdf-toolbar__btn" aria-label="Zoom in" title="Zoom in">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
                <span class="pdf-toolbar__divider" aria-hidden="true"></span>
                <span id="page-indicator" class="pdf-toolbar__pages"></span>
                <span class="pdf-toolbar__divider" aria-hidden="true"></span>
                <a href="static/CV, Zhexin Wu.pdf" download class="pdf-toolbar__btn" aria-label="Download PDF"
                    title="Download">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v12" />
                        <path d="M7 10l5 5 5-5" />
                        <path d="M5 19h14" />
                    </svg>
                </a>
            </div>
        </header>

        <main id="pdf-viewer" class="pdf-viewer" role="document" aria-label="Curriculum Vitae">
            <p id="pdf-fallback" class="pdf-fallback" hidden>
                Your browser couldn't display the CV inline.
                <a href="static/CV, Zhexin Wu.pdf" target="_blank" rel="noopener">Open the PDF directly</a>.
            </p>
        </main>
    </div>

    <script type="module" src="js/cv_js.js"></script>
</body>

</html>
